name: Build Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Python 3.8 is the last Python release line that supports Windows 7.
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x86'

    # 3. تثبيت المكتبات
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m compileall -q main.py

    # 4. بناء ملف .exe بدون نافذة console وتضمين مفتاح التشفير
    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name ITAMAgent --add-data "secret.key;." main.py

    # 5. تثبيت WiX Toolset
    - name: Install WiX Toolset
      run: |
        choco install wixtoolset -y --no-progress
        $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin" -Directory |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if (-not $wixBin) { throw "WiX Toolset v3 was not found after installation." }
        echo "$($wixBin.FullName)" >> $env:GITHUB_PATH

    # 6. بناء حزمة MSI
    - name: Build MSI
      run: |
        New-Item -ItemType Directory -Force -Path Output | Out-Null
        candle.exe -nologo -ext WixUIExtension installer.wxs
        light.exe -nologo -ext WixUIExtension -out Output\ITAM_Agent.msi installer.wixobj
        if (-not (Test-Path Output\ITAM_Agent.msi)) { throw "MSI build did not produce Output\ITAM_Agent.msi." }

    # 7. رفع الملف النهائي للتنزيل
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ITAM-Agent-Installer
        path: Output/ITAM_Agent.msi
        if-no-files-found: error